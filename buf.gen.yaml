# NOTE: buf.gen.yaml is not the canonical PHP gRPC generator.
# Always use `make proto` for committed generated contracts (which invokes protoc
# with protoc-gen-php-grpc for Spiral RoadRunner PHP gRPC service interfaces).
# Buf CLI is used primarily for linting (`buf lint`) and breaking changes (`buf breaking`).
version: v2
plugins:
  - remote: buf.build/protocolbuffers/php
    out: contracts/gen/php
  - local: protoc-gen-go
    out: contracts/gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: contracts/gen/go
    opt: paths=source_relative
