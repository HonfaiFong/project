# Code generation is driven by scripts/generate_proto.sh (protoc inside
# infra/docker/proto, via `make proto`). This file keeps `buf generate`
# usable for local one-off runs with the same plugins.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/php
    out: contracts/gen/php
  - local: protoc-gen-go
    out: contracts/gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: contracts/gen/go
    opt: paths=source_relative
