services:
  mysql:
    image: mysql:8.4
    container_name: social-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: auth_db
      # 账号仅在首次初始化或手工重跑 02-runtime-accounts.sh 时使用；不注入业务容器。
      MYSQL_AUTH_RUNTIME_PASSWORD: ${MYSQL_AUTH_RUNTIME_PASSWORD:?Set MYSQL_AUTH_RUNTIME_PASSWORD in .env}
      MYSQL_USER_RUNTIME_PASSWORD: ${MYSQL_USER_RUNTIME_PASSWORD:?Set MYSQL_USER_RUNTIME_PASSWORD in .env}
      MYSQL_CONTENT_RUNTIME_PASSWORD: ${MYSQL_CONTENT_RUNTIME_PASSWORD:?Set MYSQL_CONTENT_RUNTIME_PASSWORD in .env}
      MYSQL_SOCIAL_RUNTIME_PASSWORD: ${MYSQL_SOCIAL_RUNTIME_PASSWORD:?Set MYSQL_SOCIAL_RUNTIME_PASSWORD in .env}
      MYSQL_CHAT_RUNTIME_PASSWORD: ${MYSQL_CHAT_RUNTIME_PASSWORD:?Set MYSQL_CHAT_RUNTIME_PASSWORD in .env}
      MYSQL_MESSAGE_RUNTIME_PASSWORD: ${MYSQL_MESSAGE_RUNTIME_PASSWORD:?Set MYSQL_MESSAGE_RUNTIME_PASSWORD in .env}
      MYSQL_USER_OUTBOX_RELAY_PASSWORD: ${MYSQL_USER_OUTBOX_RELAY_PASSWORD:?Set MYSQL_USER_OUTBOX_RELAY_PASSWORD in .env}
      MYSQL_MESSAGE_OUTBOX_RELAY_PASSWORD: ${MYSQL_MESSAGE_OUTBOX_RELAY_PASSWORD:?Set MYSQL_MESSAGE_OUTBOX_RELAY_PASSWORD in .env}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Set MYSQL_MIGRATION_PASSWORD in .env}
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./infra/docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.2.4-alpine
    container_name: social-redis
    restart: unless-stopped
    # Access-token/device revocations are security state, not disposable cache.
    # Keep the named volume and fsync the AOF at least once per second so a
    # Redis process/container restart cannot silently accept a revoked token.
    command: redis-server --save "" --appendonly yes --appendfsync everysec --no-appendfsync-on-rewrite no
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.6-management
    container_name: social-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:5552:5552"
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-init:
    image: curlimages/curl:8.16.0
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - ./infra/docker/rabbitmq/definitions.json:/definitions.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'curl --fail --show-error --silent --retry 10 --retry-delay 2 --user "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD" -H "Content-Type: application/json" -X POST --data-binary @/definitions.json http://rabbitmq:15672/api/definitions'
    depends_on:
      rabbitmq:
        condition: service_healthy

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc
    container_name: social-rustfs
    restart: unless-stopped
    profiles:
      - storage
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  rustfs-permissions:
    image: alpine:3.22
    profiles:
      - storage
    command: ["sh", "-ec", "chown 10001:10001 /data0 /data1 /data2 /data3"]
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3

  storage-init:
    image: amazon/aws-cli:2.31.35
    profiles:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      STORAGE_BUCKET: ${STORAGE_BUCKET:-social-media}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$STORAGE_BUCKET" >/dev/null 2>&1 || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$STORAGE_BUCKET"'
    depends_on:
      rustfs:
        condition: service_healthy

  # 唯一的 PHP 运行时镜像;业务代码通过 bind mount 进容器,改代码无需重建。
  # 仅在 Dockerfile / PHP 版本 / 扩展 / RoadRunner 版本变化时:
  #   docker compose build php-runtime
  php-runtime:
    profiles:
      - build
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    image: project-php-runtime:rabbitmq

  database-migrate:
    image: project-php-runtime:rabbitmq
    profiles:
      - migration
    working_dir: /app
    entrypoint: ["php", "vendor/bin/phinx", "--configuration=phinx.php"]
    command: ["migrate"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: migration_ddl
      MYSQL_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Set MYSQL_MIGRATION_PASSWORD in .env}
      MYSQL_MIGRATION_LOCK_TIMEOUT: ${MYSQL_MIGRATION_LOCK_TIMEOUT:-30}
      MYSQL_SCHEMA_PREFIX: ${MYSQL_SCHEMA_PREFIX:-}
    volumes:
      - .:/app

  fake-oauth:
    image: project-php-runtime:rabbitmq
    profiles:
      - e2e
    working_dir: /app
    command: php -S 0.0.0.0:8081 /app/scripts/fake_oauth_server.php
    expose:
      - "8081"
    volumes:
      - .:/app

  auth-service:
    image: project-php-runtime:rabbitmq
    container_name: social-auth-service
    restart: unless-stopped
    working_dir: /app
    command: sh /app/scripts/roadrunner-entrypoint.sh /app/infra/roadrunner/auth.yaml
    expose:
      - "50051"
      - "9100"
    environment:
      - SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_SERVICE_INSTANCE_ID=${OTEL_SERVICE_INSTANCE_ID_AUTH_SERVICE:-auth-service}
      - OTEL_DEPLOYMENT_ENVIRONMENT=${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      - INTERNAL_RPC_GATEWAY_AUTH_TOKEN=${INTERNAL_RPC_GATEWAY_AUTH_TOKEN:?Set INTERNAL_RPC_GATEWAY_AUTH_TOKEN in .env}
      - GRPC_USER_SERVICE_TOKEN=${INTERNAL_RPC_AUTH_USER_TOKEN:?Set INTERNAL_RPC_AUTH_USER_TOKEN in .env}
      # AuthService -> UserService 用户目录调用的单跳预算须小于网关的 GRPC_AUTH_TIMEOUT_MS，确保外层截止时间起决定作用。
      - GRPC_USER_DIRECTORY_TIMEOUT_MS=${GRPC_USER_DIRECTORY_TIMEOUT_MS:-250}
      # 此处也注入网关的外层认证截止时间，以便工作进程在启动时拒绝违反预算关系的部署配置。
      - GRPC_AUTH_TIMEOUT_MS=${GRPC_AUTH_TIMEOUT_MS:-300}
      - APP_ENV=${APP_ENV:-production}
      - GRPC_TLS_MODE=${GRPC_TLS_MODE:-plaintext}
      - GRPC_TLS_CA_FILE=${GRPC_TLS_CA_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_SERVER_CERT_FILE=${GRPC_TLS_SERVER_CERT_FILE:-}
      - GRPC_TLS_SERVER_KEY_FILE=${GRPC_TLS_SERVER_KEY_FILE:-}
      - GRPC_TLS_CLIENT_AUTH_TYPE=${GRPC_TLS_CLIENT_AUTH_TYPE:-no_client_certs}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      - GRPC_TLS_SERVER_NAME_AUTH_SERVICE=${GRPC_TLS_SERVER_NAME_AUTH_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_USER_SERVICE=${GRPC_TLS_SERVER_NAME_USER_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CONTENT_SERVICE=${GRPC_TLS_SERVER_NAME_CONTENT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE=${GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CHAT_SERVICE=${GRPC_TLS_SERVER_NAME_CHAT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE=${GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE:-}
      # Snowflake 服务槽位（0-31）。同一服务的副本可复用此值；WorkerId::resolve()
      # 通过 Redis 租约在槽位内原子分配 RoadRunner worker 编号。
      - WORKER_ID=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=auth_runtime
      - MYSQL_PASSWORD=${MYSQL_AUTH_RUNTIME_PASSWORD:?Set MYSQL_AUTH_RUNTIME_PASSWORD in .env}
      - AUTH_DB_NAME=auth_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - WS_TICKET_SECRET=${WS_TICKET_SECRET:?Set WS_TICKET_SECRET in .env}
      - ENABLE_WECHAT_LOGIN=${ENABLE_WECHAT_LOGIN:-false}
      - ENABLE_QQ_LOGIN=${ENABLE_QQ_LOGIN:-false}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - WECHAT_IDENTITY_NAMESPACE=${WECHAT_IDENTITY_NAMESPACE:-wechat-main}
      - WECHAT_TOKEN_ENDPOINT=${WECHAT_TOKEN_ENDPOINT:-https://api.weixin.qq.com/sns/oauth2/access_token}
      - QQ_APP_ID=${QQ_APP_ID:-}
      - QQ_APP_KEY=${QQ_APP_KEY:-}
      - QQ_REDIRECT_URI=${QQ_REDIRECT_URI:-}
      - QQ_IDENTITY_NAMESPACE=${QQ_IDENTITY_NAMESPACE:-qq-main}
      - QQ_TOKEN_ENDPOINT=${QQ_TOKEN_ENDPOINT:-https://graph.qq.com/oauth2.0/token}
      - QQ_OPEN_ID_ENDPOINT=${QQ_OPEN_ID_ENDPOINT:-https://graph.qq.com/oauth2.0/me}
      - SOCIAL_OAUTH_ALLOW_INSECURE_HTTP=${SOCIAL_OAUTH_ALLOW_INSECURE_HTTP:-false}
      - SOCIAL_HTTP_CONNECT_TIMEOUT_MS=${SOCIAL_HTTP_CONNECT_TIMEOUT_MS:-1000}
      - SOCIAL_HTTP_TIMEOUT_MS=${SOCIAL_HTTP_TIMEOUT_MS:-3000}
      - PHONE_DEFAULT_REGION=${PHONE_DEFAULT_REGION:-CN}
      - ENABLE_DEV_LOGIN=${ENABLE_DEV_LOGIN:-false}
      - DEV_LOGIN_CODE=${DEV_LOGIN_CODE:-}
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: project-php-runtime:rabbitmq
    container_name: social-user-service
    restart: unless-stopped
    working_dir: /app
    command: sh /app/scripts/roadrunner-entrypoint.sh /app/infra/roadrunner/user.yaml
    expose:
      - "50052"
      - "9100"
    environment:
      - SERVICE_NAME=user-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=user-service
      - OTEL_SERVICE_INSTANCE_ID=${OTEL_SERVICE_INSTANCE_ID_USER_SERVICE:-user-service}
      - OTEL_DEPLOYMENT_ENVIRONMENT=${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      - APP_ENV=${APP_ENV:-production}
      - GRPC_TLS_MODE=${GRPC_TLS_MODE:-plaintext}
      - GRPC_TLS_CA_FILE=${GRPC_TLS_CA_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_SERVER_CERT_FILE=${GRPC_TLS_SERVER_CERT_FILE:-}
      - GRPC_TLS_SERVER_KEY_FILE=${GRPC_TLS_SERVER_KEY_FILE:-}
      - GRPC_TLS_CLIENT_AUTH_TYPE=${GRPC_TLS_CLIENT_AUTH_TYPE:-no_client_certs}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      - GRPC_TLS_SERVER_NAME_USER_SERVICE=${GRPC_TLS_SERVER_NAME_USER_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CONTENT_SERVICE=${GRPC_TLS_SERVER_NAME_CONTENT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE=${GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CHAT_SERVICE=${GRPC_TLS_SERVER_NAME_CHAT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE=${GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE:-}
      - INTERNAL_RPC_GATEWAY_USER_TOKEN=${INTERNAL_RPC_GATEWAY_USER_TOKEN:?Set INTERNAL_RPC_GATEWAY_USER_TOKEN in .env}
      - INTERNAL_RPC_AUTH_USER_TOKEN=${INTERNAL_RPC_AUTH_USER_TOKEN:?Set INTERNAL_RPC_AUTH_USER_TOKEN in .env}
      - INTERNAL_RPC_CONTENT_USER_TOKEN=${INTERNAL_RPC_CONTENT_USER_TOKEN:?Set INTERNAL_RPC_CONTENT_USER_TOKEN in .env}
      - INTERNAL_RPC_SOCIAL_USER_TOKEN=${INTERNAL_RPC_SOCIAL_USER_TOKEN:?Set INTERNAL_RPC_SOCIAL_USER_TOKEN in .env}
      - INTERNAL_RPC_CHAT_USER_TOKEN=${INTERNAL_RPC_CHAT_USER_TOKEN:?Set INTERNAL_RPC_CHAT_USER_TOKEN in .env}
      # Snowflake 服务槽位（0-31）；副本可复用槽位，Redis 租约为每个 RoadRunner worker
      # 分配唯一进程槽；参见上方 auth-service 的说明。
      - WORKER_ID=2
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=user_runtime
      - MYSQL_PASSWORD=${MYSQL_USER_RUNTIME_PASSWORD:?Set MYSQL_USER_RUNTIME_PASSWORD in .env}
      - USER_DB_NAME=user_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - PHONE_DEFAULT_REGION=${PHONE_DEFAULT_REGION:-CN}
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  content-service:
    image: project-php-runtime:rabbitmq
    container_name: social-content-service
    restart: unless-stopped
    working_dir: /app
    command: sh /app/scripts/roadrunner-entrypoint.sh /app/infra/roadrunner/content.yaml
    expose:
      - "50053"
      - "9100"
    environment:
      - SERVICE_NAME=content-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=content-service
      - OTEL_SERVICE_INSTANCE_ID=${OTEL_SERVICE_INSTANCE_ID_CONTENT_SERVICE:-content-service}
      - OTEL_DEPLOYMENT_ENVIRONMENT=${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      - APP_ENV=${APP_ENV:-production}
      - GRPC_TLS_MODE=${GRPC_TLS_MODE:-plaintext}
      - GRPC_TLS_CA_FILE=${GRPC_TLS_CA_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_SERVER_CERT_FILE=${GRPC_TLS_SERVER_CERT_FILE:-}
      - GRPC_TLS_SERVER_KEY_FILE=${GRPC_TLS_SERVER_KEY_FILE:-}
      - GRPC_TLS_CLIENT_AUTH_TYPE=${GRPC_TLS_CLIENT_AUTH_TYPE:-no_client_certs}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      - GRPC_TLS_SERVER_NAME_USER_SERVICE=${GRPC_TLS_SERVER_NAME_USER_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CONTENT_SERVICE=${GRPC_TLS_SERVER_NAME_CONTENT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE=${GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CHAT_SERVICE=${GRPC_TLS_SERVER_NAME_CHAT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE=${GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE:-}
      - INTERNAL_RPC_GATEWAY_CONTENT_TOKEN=${INTERNAL_RPC_GATEWAY_CONTENT_TOKEN:?Set INTERNAL_RPC_GATEWAY_CONTENT_TOKEN in .env}
      - INTERNAL_RPC_CHAT_CONTENT_TOKEN=${INTERNAL_RPC_CHAT_CONTENT_TOKEN:?Set INTERNAL_RPC_CHAT_CONTENT_TOKEN in .env}
      - INTERNAL_RPC_SOCIAL_CONTENT_TOKEN=${INTERNAL_RPC_SOCIAL_CONTENT_TOKEN:?Set INTERNAL_RPC_SOCIAL_CONTENT_TOKEN in .env}
      - INTERNAL_RPC_MESSAGE_CONTENT_TOKEN=${INTERNAL_RPC_MESSAGE_CONTENT_TOKEN:?Set INTERNAL_RPC_MESSAGE_CONTENT_TOKEN in .env}
      - INTERNAL_RPC_MODERATION_CONTENT_TOKEN=${INTERNAL_RPC_MODERATION_CONTENT_TOKEN:?Set INTERNAL_RPC_MODERATION_CONTENT_TOKEN in .env}
      - GRPC_USER_SERVICE=user-service:50052
      - GRPC_USER_TOKEN=${INTERNAL_RPC_CONTENT_USER_TOKEN:?Set INTERNAL_RPC_CONTENT_USER_TOKEN in .env}
      - GRPC_USER_TIMEOUT_MS=${GRPC_USER_DIRECTORY_TIMEOUT_MS:-250}
      - GRPC_SOCIAL_SERVICE=social-service:50054
      - GRPC_SOCIAL_SERVICE_TOKEN=${INTERNAL_RPC_CONTENT_SOCIAL_TOKEN:?Set INTERNAL_RPC_CONTENT_SOCIAL_TOKEN in .env}
      - GRPC_SOCIAL_BLOCK_TIMEOUT_MS=${GRPC_SOCIAL_BLOCK_TIMEOUT_MS:-200}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=content_runtime
      - MYSQL_PASSWORD=${MYSQL_CONTENT_RUNTIME_PASSWORD:?Set MYSQL_CONTENT_RUNTIME_PASSWORD in .env}
      - CONTENT_DB_NAME=content_db
      - ANONYMOUS_IDENTITY_KEY=${ANONYMOUS_IDENTITY_KEY:?Set ANONYMOUS_IDENTITY_KEY in .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - WORKER_ID=3
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started

  social-service:
    image: project-php-runtime:rabbitmq
    container_name: social-social-service
    restart: unless-stopped
    working_dir: /app
    command: sh /app/scripts/roadrunner-entrypoint.sh /app/infra/roadrunner/social.yaml
    expose:
      - "50054"
      - "9100"
    environment:
      - SERVICE_NAME=social-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=social-service
      - OTEL_SERVICE_INSTANCE_ID=${OTEL_SERVICE_INSTANCE_ID_SOCIAL_SERVICE:-social-service}
      - OTEL_DEPLOYMENT_ENVIRONMENT=${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      - APP_ENV=${APP_ENV:-production}
      - GRPC_TLS_MODE=${GRPC_TLS_MODE:-plaintext}
      - GRPC_TLS_CA_FILE=${GRPC_TLS_CA_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_SERVER_CERT_FILE=${GRPC_TLS_SERVER_CERT_FILE:-}
      - GRPC_TLS_SERVER_KEY_FILE=${GRPC_TLS_SERVER_KEY_FILE:-}
      - GRPC_TLS_CLIENT_AUTH_TYPE=${GRPC_TLS_CLIENT_AUTH_TYPE:-no_client_certs}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      - GRPC_TLS_SERVER_NAME_USER_SERVICE=${GRPC_TLS_SERVER_NAME_USER_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CONTENT_SERVICE=${GRPC_TLS_SERVER_NAME_CONTENT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE=${GRPC_TLS_SERVER_NAME_SOCIAL_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_CHAT_SERVICE=${GRPC_TLS_SERVER_NAME_CHAT_SERVICE:-}
      - GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE=${GRPC_TLS_SERVER_NAME_MESSAGE_SERVICE:-}
      - INTERNAL_RPC_GATEWAY_SOCIAL_TOKEN=${INTERNAL_RPC_GATEWAY_SOCIAL_TOKEN:?Set INTERNAL_RPC_GATEWAY_SOCIAL_TOKEN in .env}
      - INTERNAL_RPC_CHAT_SOCIAL_TOKEN=${INTERNAL_RPC_CHAT_SOCIAL_TOKEN:?Set INTERNAL_RPC_CHAT_SOCIAL_TOKEN in .env}
      - INTERNAL_RPC_CONTENT_SOCIAL_TOKEN=${INTERNAL_RPC_CONTENT_SOCIAL_TOKEN:?Set INTERNAL_RPC_CONTENT_SOCIAL_TOKEN in .env}
      - GRPC_USER_SERVICE=user-service:50052
      - GRPC_USER_SERVICE_TOKEN=${INTERNAL_RPC_SOCIAL_USER_TOKEN:?Set INTERNAL_RPC_SOCIAL_USER_TOKEN in .env}
      - GRPC_CONTENT_SERVICE=content-service:50053
      - GRPC_CONTENT_SERVICE_TOKEN=${INTERNAL_RPC_SOCIAL_CONTENT_TOKEN:?Set INTERNAL_RPC_SOCIAL_CONTENT_TOKEN in .env}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=social_runtime
      - MYSQL_PASSWORD=${MYSQL_SOCIAL_RUNTIME_PASSWORD:?Set MYSQL_SOCIAL_RUNTIME_PASSWORD in .env}
      - SOCIAL_DB_NAME=social_db
      - GRPC_USER_DIRECTORY_TIMEOUT_MS=${GRPC_USER_DIRECTORY_TIMEOUT_MS:-250}
      - GRPC_CONTENT_AUTHORIZATION_TIMEOUT_MS=${GRPC_CONTENT_AUTHORIZATION_TIMEOUT_MS:-250}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
