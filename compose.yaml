services:
  mysql:
    image: mysql:8.4
    container_name: social-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: auth_db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./infra/docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.2.4-alpine
    container_name: social-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.6-management
    container_name: social-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "5552:5552"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-init:
    image: curlimages/curl:8.16.0
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - ./infra/docker/rabbitmq/definitions.json:/definitions.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'curl --fail --show-error --silent --retry 10 --retry-delay 2 --user "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD" -H "Content-Type: application/json" -X POST --data-binary @/definitions.json http://rabbitmq:15672/api/definitions'
    depends_on:
      rabbitmq:
        condition: service_healthy

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc
    container_name: social-rustfs
    restart: unless-stopped
    profiles:
      - storage
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  rustfs-permissions:
    image: alpine:3.22
    profiles:
      - storage
    command: ["sh", "-ec", "chown 10001:10001 /data0 /data1 /data2 /data3"]
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3

  storage-init:
    image: amazon/aws-cli:2.31.35
    profiles:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      STORAGE_BUCKET: ${STORAGE_BUCKET:-social-media}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$STORAGE_BUCKET" >/dev/null 2>&1 || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$STORAGE_BUCKET"'
    depends_on:
      rustfs:
        condition: service_healthy

  # 唯一的 PHP 运行时镜像;业务代码通过 bind mount 进容器,改代码无需重建。
  # 仅在 Dockerfile / PHP 版本 / 扩展 / RoadRunner 版本变化时:
  #   docker compose build php-runtime
  php-runtime:
    profiles:
      - build
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    image: project-php-runtime:rabbitmq

  auth-service:
    image: project-php-runtime:rabbitmq
    container_name: social-auth-service
    restart: unless-stopped
    working_dir: /app
    command: rr serve -c infra/roadrunner/auth.yaml
    ports:
      - "50051:50051"
    environment:
      - SERVICE_NAME=auth-service
      # Snowflake service slot (0-31). Replicas of this service must use
      # distinct values; WorkerId::resolve() spreads rr worker processes
      # within the slot automatically.
      - WORKER_ID=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - AUTH_DB_NAME=auth_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - WS_TICKET_SECRET=${WS_TICKET_SECRET:?Set WS_TICKET_SECRET in .env}
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: project-php-runtime:rabbitmq
    container_name: social-user-service
    restart: unless-stopped
    working_dir: /app
    command: rr serve -c infra/roadrunner/user.yaml
    ports:
      - "50052:50052"
    environment:
      - SERVICE_NAME=user-service
      # Snowflake service slot (0-31). See auth-service note above.
      - WORKER_ID=2
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - USER_DB_NAME=user_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-outbox-relay:
    image: project-php-runtime:rabbitmq
    container_name: social-user-outbox-relay
    restart: unless-stopped
    working_dir: /app
    command: php services/user-service/bin/outbox-relay.php
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      USER_DB_NAME: user_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully

  api-gateway:
    image: project-php-runtime:rabbitmq
    container_name: social-api-gateway
    restart: unless-stopped
    working_dir: /app
    command: php apps/api-gateway/start.php start
    ports:
      - "8787:8787"
    environment:
      - SERVICE_NAME=api-gateway
      - GRPC_AUTH_SERVICE=auth-service:50051
      - GRPC_USER_SERVICE=user-service:50052
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ENABLE_DEV_LOGIN=${ENABLE_DEV_LOGIN:-false}
      - DEV_LOGIN_CODE=${DEV_LOGIN_CODE:-}
    volumes:
      - .:/app
    depends_on:
      - auth-service
      - user-service
      - redis

  realtime-gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway/Dockerfile
    image: project-realtime-gateway:redis-nonce
    container_name: social-realtime-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - REDIS_HOST=redis:6379
      - WS_TICKET_SECRET=${WS_TICKET_SECRET:?Set WS_TICKET_SECRET in .env}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
