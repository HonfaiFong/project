services:
  mysql:
    image: mysql:8.4
    container_name: social-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: auth_db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./infra/docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.2.4-alpine
    container_name: social-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: social-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  minio:
    # MinIO withdrew their community images from Docker Hub; the official
    # source is quay.io. Some environments now require authenticated pulls.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: social-minio
    restart: unless-stopped
    profiles:
      - storage
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data

  # 唯一的 PHP 运行时镜像;业务代码通过 bind mount 进容器,改代码无需重建。
  # 仅在 Dockerfile / PHP 版本 / 扩展 / RoadRunner 版本变化时:
  #   docker compose build php-runtime
  php-runtime:
    profiles:
      - build
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    image: project-php-runtime:dev

  auth-service:
    image: project-php-runtime:dev
    container_name: social-auth-service
    restart: unless-stopped
    working_dir: /app
    command: rr serve -c infra/roadrunner/auth.yaml
    ports:
      - "50051:50051"
    environment:
      - SERVICE_NAME=auth-service
      # Snowflake service slot (0-31). Replicas of this service must use
      # distinct values; WorkerId::resolve() spreads rr worker processes
      # within the slot automatically.
      - WORKER_ID=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - AUTH_DB_NAME=auth_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - WS_TICKET_SECRET=${WS_TICKET_SECRET:?Set WS_TICKET_SECRET in .env}
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: project-php-runtime:dev
    container_name: social-user-service
    restart: unless-stopped
    working_dir: /app
    command: rr serve -c infra/roadrunner/user.yaml
    ports:
      - "50052:50052"
    environment:
      - SERVICE_NAME=user-service
      # Snowflake service slot (0-31). See auth-service note above.
      - WORKER_ID=2
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - USER_DB_NAME=user_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    image: project-php-runtime:dev
    container_name: social-api-gateway
    restart: unless-stopped
    working_dir: /app
    command: php apps/api-gateway/start.php start
    ports:
      - "8787:8787"
    environment:
      - SERVICE_NAME=api-gateway
      - GRPC_AUTH_SERVICE=auth-service:50051
      - GRPC_USER_SERVICE=user-service:50052
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ENABLE_DEV_LOGIN=${ENABLE_DEV_LOGIN:-false}
      - DEV_LOGIN_CODE=${DEV_LOGIN_CODE:-}
    volumes:
      - .:/app
    depends_on:
      - auth-service
      - user-service
      - redis

  realtime-gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway/Dockerfile
    image: project-realtime-gateway:latest
    container_name: social-realtime-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - REDIS_HOST=redis:6379
      - WS_TICKET_SECRET=${WS_TICKET_SECRET:?Set WS_TICKET_SECRET in .env}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  minio_data:
