name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # buf breaking compares against the merge base
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, redis, bcmath, sockets, grpc
          coverage: none

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify generated Proto contracts
        run: |
          make proto
          test -z "$(git status --porcelain -- contracts/gen)"

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf Lint
        run: buf lint

      - name: Buf Breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#ref=${{ github.event.pull_request.base.sha }}"

      - name: Run Lint
        run: make lint

      - name: Run Static Analysis
        run: make analyse

      - name: Run Tests
        run: make test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PHP runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/php/Dockerfile
          push: false
          tags: project-php-runtime:ci
          cache-from: type=gha,scope=php-runtime
          cache-to: type=gha,scope=php-runtime,mode=max

      - name: Build realtime gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/gateway/Dockerfile
          push: false
          tags: project-realtime-gateway:ci
          cache-from: type=gha,scope=realtime-gateway
          cache-to: type=gha,scope=realtime-gateway,mode=max
