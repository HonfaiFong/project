name: CI

on:
  push:
    branches: [ main, master, codex/auth-review-2c13d86 ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rabbitmq-contract:
    name: RabbitMQ publisher contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pdo_sqlite, redis, bcmath, sockets, grpc
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: docker compose up -d rabbitmq
      - run: docker compose run --rm rabbitmq-init
      - name: Verify Stream routing and mandatory return
        run: vendor/bin/phpunit tests/Integration/RabbitMqPublisherContractTest.php --fail-on-skipped
        env:
          RABBITMQ_INTEGRATION: '1'
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: '5672'
          RABBITMQ_USER: social_app
          RABBITMQ_PASSWORD: replace-with-random-local-rabbitmq-password
      - if: always()
        run: docker compose logs rabbitmq rabbitmq-init

  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # buf breaking 与合并基点比较
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pdo_sqlite, redis, bcmath, sockets, grpc
          coverage: none

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify generated Proto contracts
        run: |
          make proto
          if [ -n "$(git status --porcelain -- contracts/gen)" ]; then
            echo "Generated proto files are stale:"
            git status --short -- contracts/gen
            git diff -- contracts/gen
            exit 1
          fi

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf Lint
        run: buf lint

      - name: Buf Breaking
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))
        env:
          BUF_BREAKING_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BUF_BREAKING_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "Skipping Buf Breaking because this push has no previous commit to compare."
            exit 0
          fi
          buf breaking --against ".git#ref=$BUF_BREAKING_REF"

      - name: Run Lint
        run: make lint

      - name: Verify deployment lifecycle isolation
        run: bash scripts/test_deployment_lifecycle.sh

      - name: Run Static Analysis
        run: make analyse

      - name: Run Unit and Go Tests
        run: make test

      - name: Run SQLite-backed integration tests
        run: vendor/bin/phpunit tests/Integration/ChatMessagePersistenceTest.php tests/Integration/ContentAuthorizationTest.php tests/Integration/EloquentPersistenceTest.php tests/Integration/GatewayWebmanWiringTest.php tests/Integration/UserOutboxTransactionTest.php tests/Integration/AuthLogoutRecoveryTest.php --fail-on-skipped

      - name: Run Go Race Detector
        run: go test -mod=mod -race ./gateways/realtime-gateway/...

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PHP runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/php/Dockerfile
          load: true
          tags: |
            project-php-runtime:rabbitmq
          cache-from: type=gha,scope=php-runtime
          cache-to: type=gha,scope=php-runtime,mode=max

      - name: Build realtime gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/gateway/Dockerfile
          load: true
          tags: |
            project-realtime-gateway:redis-nonce
          cache-from: type=gha,scope=realtime-gateway
          cache-to: type=gha,scope=realtime-gateway,mode=max

      - name: Setup PHP for E2E runner
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # posix/pcntl 供隔离进程回归测试使用：MetricsHttpServer 依赖 posix_getppid 探测父进程存活。
          extensions: pdo, pdo_pgsql, pdo_sqlite, redis, bcmath, sockets, grpc, posix, pcntl
          coverage: none

      - name: Install Composer dependencies for E2E
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment configuration
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          APP_ENV=testing
          PG_DATABASE=test_social_backend
          ENABLE_WECHAT_LOGIN=true
          ENABLE_QQ_LOGIN=true
          WECHAT_APP_ID=e2e-wechat-app
          WECHAT_APP_SECRET=e2e-wechat-secret
          WECHAT_TOKEN_ENDPOINT=http://fake-oauth:8081/sns/oauth2/access_token
          QQ_APP_ID=e2e-qq-app
          QQ_APP_KEY=e2e-qq-key
          QQ_REDIRECT_URI=http://e2e.test/callback
          QQ_TOKEN_ENDPOINT=http://fake-oauth:8081/oauth2.0/token
          QQ_OPEN_ID_ENDPOINT=http://fake-oauth:8081/oauth2.0/me
          SOCIAL_OAUTH_ALLOW_INSECURE_HTTP=true
          EOF

      - name: Start infrastructure
        run: docker compose up -d postgres redis

      - name: Wait for database readiness
        run: make postgres-ready redis-ready

      - name: Verify PostgreSQL rejects wrong credentials
        run: |
          if docker compose exec -T postgres sh -ec \
            'PGPASSWORD=definitely-wrong-password psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1'; then
            echo "PostgreSQL accepted invalid credentials"
            exit 1
          fi

      - name: Run database migrations
        run: make migrate

      - name: Start fake OAuth upstream for social E2E
        run: docker compose --profile e2e up -d fake-oauth

      - name: Verify production auth readiness and startup guards
        run: bash scripts/test_production_auth_config.sh

      - name: Verify health RPC reconnection and deadline boundaries
        run: docker compose run --rm --no-deps auth-service php /app/vendor/bin/phpunit /app/tests/Integration/HealthRetryTest.php --cache-directory /tmp/project-phpunit-cache --fail-on-skipped

      - name: Run PostgreSQL and message storage regression tests
        timeout-minutes: 5
        run: |
          make test-message
          docker compose run --rm --no-deps -e DATABASE_INTEGRATION=1 --entrypoint php database-migrate vendor/bin/phpunit tests/Integration/PostgresMigrationRuntimeTest.php --fail-on-skipped

      - name: Run Redis integration tests
        run: vendor/bin/phpunit tests/Integration/RedisSocialAuthSupportTest.php --fail-on-skipped
        env:
          SOCIAL_TEST_REDIS_HOST: 127.0.0.1
          SOCIAL_TEST_REDIS_PORT: '6379'

      - name: Run process isolation and lease maintenance tests
        # 这三项验证本轮新增的常驻进程机制：指标子进程随父进程退出、OTLP 导出不阻塞业务、
        # 空闲 Worker 仍续租。它们需要真实的 Redis 与可用的 proc_open/posix，禁止跳过。
        timeout-minutes: 5
        run: vendor/bin/phpunit tests/Integration/MetricsLifecycleTest.php tests/Integration/OtlpIsolationTest.php tests/Integration/WorkerLeaseIdleTest.php --fail-on-skipped
        env:
          SOCIAL_TEST_REDIS_HOST: 127.0.0.1
          SOCIAL_TEST_REDIS_PORT: '6379'

      - name: Start application services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for API Gateway /health to report SERVING..."
          ready=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/health 2>/dev/null | grep -q '"status":"SERVING"'; then
              ready=1
              echo "Services are ready and SERVING!"
              break
            fi
            echo "Waiting for services (attempt $i)..."
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Services failed to become ready within timeout!"
            exit 1
          fi

      - name: Verify internal gRPC authorization from API Gateway
        run: docker compose exec -T api-gateway php /app/scripts/test_internal_rpc.php

      - name: Verify internal gRPC authorization from AuthService
        run: docker compose exec -T auth-service php /app/scripts/test_internal_rpc.php --caller=auth-service

      - name: Run End-to-End Tests
        run: make e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

  redis-persistence:
    name: Redis revocation persistence
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ci-redis-persistence
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment configuration
        run: cp .env.example .env

      - name: Verify revocation records survive a Redis restart
        run: bash scripts/redis_revocation_persistence_test.sh

      - name: Dump Redis logs on failure
        if: always()
        run: docker compose logs redis
