name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # buf breaking compares against the merge base
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, redis, bcmath, sockets, grpc
          coverage: none

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify generated Proto contracts
        run: |
          make proto
          if [ -n "$(git status --porcelain -- contracts/gen)" ]; then
            echo "Generated proto files are stale:"
            git status --short -- contracts/gen
            git diff -- contracts/gen
            exit 1
          fi

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf Lint
        run: buf lint

      - name: Buf Breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#ref=${{ github.event.pull_request.base.sha }}"

      - name: Run Lint
        run: make lint

      - name: Run Static Analysis
        run: make analyse

      - name: Run Tests
        run: make test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PHP runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/php/Dockerfile
          load: true
          tags: |
            project-php-runtime:dev
            project-php-runtime:ci
          cache-from: type=gha,scope=php-runtime
          cache-to: type=gha,scope=php-runtime,mode=max

      - name: Build realtime gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/gateway/Dockerfile
          load: true
          tags: |
            project-realtime-gateway:latest
            project-realtime-gateway:ci
          cache-from: type=gha,scope=realtime-gateway
          cache-to: type=gha,scope=realtime-gateway,mode=max

      - name: Setup PHP for E2E runner
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, redis, bcmath, sockets, grpc
          coverage: none

      - name: Install Composer dependencies for E2E
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment configuration
        run: cp .env.example .env

      - name: Start infrastructure
        run: docker compose up -d mysql redis

      - name: Wait for MySQL to become healthy
        run: |
          echo "Waiting for MySQL to become healthy..."
          ready=0
          for i in {1..30}; do
            if docker compose exec -T mysql sh -c 'mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'; then
              ready=1
              echo "MySQL is healthy!"
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "MySQL failed to become healthy within timeout!"
            exit 1
          fi

      - name: Run database migrations
        run: make migrate

      - name: Start application services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for API Gateway /health to report SERVING..."
          ready=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/health 2>/dev/null | grep -q '"status":"SERVING"'; then
              ready=1
              echo "Services are ready and SERVING!"
              break
            fi
            echo "Waiting for services (attempt $i)..."
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Services failed to become ready within timeout!"
            exit 1
          fi

      - name: Run End-to-End Tests
        run: make e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs
