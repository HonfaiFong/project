version: '3'

server:
  command: php /app/services/social-service/bin/server.php
  relay: pipes

grpc:
  listen: tcp://0.0.0.0:50054
  proto:
    - /app/contracts/proto/social/v1/social.proto
    - /app/contracts/proto/common/v1/identity.proto
    - /app/contracts/proto/common/v1/health.proto
  pool:
    num_workers: 2

logs:
  mode: production
  level: info
