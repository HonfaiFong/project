version: v2
modules:
  - path: contracts/proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
  ignore_only:
    # health.proto 有意沿用 gRPC 健康检查协议的消息名称（HealthCheckRequest / HealthCheckResponse）。
    RPC_REQUEST_STANDARD_NAME:
      - contracts/proto/common/v1/health.proto
    RPC_RESPONSE_STANDARD_NAME:
      - contracts/proto/common/v1/health.proto
breaking:
  use:
    - FILE
