syntax = "proto3";

package user.v1;

option go_package = "social-backend/contracts/gen/go/user/v1;userv1";
option php_namespace = "Contracts\\Gen\\User\\V1";
option php_metadata_namespace = "Contracts\\Gen\\GPBMetadata\\User\\V1";

message PersonaProfile {
  uint64 id = 1;
  uint64 user_id = 2;
  int32 type = 3;
  string nickname = 4;
  string avatar_key = 5;
  string bio = 6;
  int32 status = 7;
  string created_at = 8;
  string updated_at = 9;
  bool is_internal_alias = 10;
  string identity_mode = 11;
  bool profile_accessible = 12;
}

// The operation must be explicit. UNSPECIFIED and unknown values fail closed.
enum PersonaOperation {
  PERSONA_OPERATION_UNSPECIFIED = 0;
  PERSONA_OPERATION_CREATE_POST = 1;
  PERSONA_OPERATION_CREATE_COMMENT = 2;
  PERSONA_OPERATION_CREATE_CONVERSATION = 3;
  PERSONA_OPERATION_SEND_MESSAGE = 4;
  PERSONA_OPERATION_LIKE = 10;
  PERSONA_OPERATION_UNLIKE = 11;
  PERSONA_OPERATION_FOLLOW = 12;
  PERSONA_OPERATION_UNFOLLOW = 13;
  PERSONA_OPERATION_BLOCK = 14;
  PERSONA_OPERATION_UNBLOCK = 15;
  PERSONA_OPERATION_REPORT = 16;
  PERSONA_OPERATION_CONNECT = 17;
  PERSONA_OPERATION_UPDATE_PROFILE = 18;
}

enum PersonaMode {
  PERSONA_MODE_UNSPECIFIED = 0;
  PERSONA_MODE_MAIN = 1;
  PERSONA_MODE_ALIAS = 2;
}

message CreatePersonaRequest {
  uint64 user_id = 1;
  // Deprecated compatibility field. Persona creation is disabled; callers
  // must not use this field. It is retained only for wire compatibility.
  int32 type = 2 [deprecated = true];
  string nickname = 3;
  string avatar_key = 4;
  string bio = 5;
}

message CreatePersonaResponse {
  PersonaProfile persona = 1;
}

message GetPersonaRequest {
  uint64 persona_id = 1;
}

message GetPersonaResponse {
  PersonaProfile persona = 1;
}

// Validates that a persona belongs to the authenticated account and is usable.
// The response is an internal profile; public callers must use a presenter.
message ValidatePersonaOwnershipRequest {
  uint64 user_id = 1;
  uint64 persona_id = 2;
  PersonaOperation operation = 3;
}

message ValidatePersonaOwnershipResponse {
  PersonaProfile persona = 1;
}

message ResolvePersonaModeRequest {
  uint64 user_id = 1;
  PersonaMode mode = 2;
  PersonaOperation operation = 3;
}

message ResolvePersonaModeResponse {
  PersonaProfile persona = 1;
}

message BatchGetPersonasRequest {
  repeated uint64 persona_ids = 1;
}

message BatchGetPersonasResponse {
  repeated PersonaProfile personas = 1;
}

message UpdatePersonaRequest {
  uint64 persona_id = 1;
  uint64 user_id = 2; // 用于归属校验
  optional string nickname = 3;
  optional string avatar_key = 4;
  optional string bio = 5;
}

message UpdatePersonaResponse {
  PersonaProfile persona = 1;
}

message ListPersonasRequest {
  uint64 user_id = 1;
}

message ListPersonasResponse {
  repeated PersonaProfile personas = 1;
}
