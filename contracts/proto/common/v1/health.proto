syntax = "proto3";

package common.v1;

option go_package = "social-backend/contracts/gen/go/common/v1;commonv1";
option php_namespace = "Contracts\\Gen\\Common\\V1";
option php_metadata_namespace = "Contracts\\Gen\\GPBMetadata\\Common\\V1";

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_SERVING = 1;
  HEALTH_STATUS_NOT_SERVING = 2;
  HEALTH_STATUS_UNKNOWN = 3;
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  HealthStatus status = 1;
  string message = 2;
}

service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
