syntax = "proto3";

package common.v1;

option go_package = "social-backend/contracts/gen/go/common/v1;commonv1";
option php_namespace = "Contracts\\Gen\\Common\\V1";
option php_metadata_namespace = "Contracts\\Gen\\GPBMetadata\\Common\\V1";

// Safe public projection. Internal user/persona ownership fields remain in
// their existing messages and must never be serialized as this author.
enum IdentityMode {
  IDENTITY_MODE_UNSPECIFIED = 0;
  IDENTITY_MODE_MAIN = 1;
  IDENTITY_MODE_ALIAS = 2;
}

message PublicAuthor {
  IdentityMode identity_mode = 1;
  uint64 persona_id = 2; // populated only for MAIN
  string display_name = 3;
  string avatar_key = 4;
  string anonymous_ref = 5; // populated only for ALIAS
  bool profile_accessible = 6;
}
