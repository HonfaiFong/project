syntax = "proto3";

package auth.v1;

option go_package = "social-backend/contracts/gen/go/auth/v1;authv1";
option php_namespace = "Contracts\\Gen\\Auth\\V1";
option php_metadata_namespace = "Contracts\\Gen\\GPBMetadata\\Auth\\V1";

message DeviceInfo {
  string device_uuid = 1;
  string platform = 2;
  string app_version = 3;
  string push_token = 4;
}

message LoginRequest {
  string phone = 1;
  string code = 2; // dev verification code or sms
  string password = 3;
  DeviceInfo device = 4;

  reserved 5, 6;
  reserved "user_id", "is_new_user";
}

message LoginResponse {
  uint64 user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 access_token_expires_at = 4;
  int64 refresh_token_expires_at = 5;
  bool is_new_user = 6;
}

enum SocialProvider {
  SOCIAL_PROVIDER_UNSPECIFIED = 0;
  SOCIAL_PROVIDER_WECHAT = 1;
  SOCIAL_PROVIDER_QQ = 2;
}

enum SocialLoginState {
  SOCIAL_LOGIN_STATE_UNSPECIFIED = 0;
  SOCIAL_LOGIN_STATE_AUTHENTICATED = 1;
  // Deprecated: registration no longer asks clients for a phone binding step.
  SOCIAL_LOGIN_STATE_PHONE_BINDING_REQUIRED = 2;
}

message SocialLoginRequest {
  SocialProvider provider = 1;
  string code = 2;
  DeviceInfo device = 3;
}

message SocialLoginResponse {
  SocialLoginState state = 1;
  LoginResponse login = 2;
  string bind_token = 3;
  int64 bind_token_expires_at = 4;
}

message SendSocialPhoneCodeRequest {
  string bind_token = 1;
  string phone = 2;
}

message SendSocialPhoneCodeResponse {
  int32 expires_in = 1;
  int32 resend_after = 2;
}

message BindSocialPhoneRequest {
  string bind_token = 1;
  string phone = 2;
  string code = 3;
  DeviceInfo device = 4;
}

message BindSocialPhoneResponse {
  LoginResponse login = 1;
}

// Binds the provider identity behind `code` to the user authenticated by
// `access_token`. The Gateway never trusts a body user_id: the user identity
// comes from the verified access token only.
message BindSocialIdentityRequest {
  SocialProvider provider = 1;
  string code = 2;
  string access_token = 3;
}

message BindSocialIdentityResponse {
  uint64 user_id = 1;
  SocialProvider provider = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  DeviceInfo device = 2;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_at = 3;
  int64 refresh_token_expires_at = 4;
}

message LogoutRequest {
  string refresh_token = 1;
  string access_token = 2;
}

message LogoutResponse {
  bool success = 1;
}

message VerifyTokenRequest {
  string access_token = 1;
}

message VerifyTokenResponse {
  bool valid = 1;
  uint64 user_id = 2;
  uint64 device_id = 3;
}

message CreateWsTicketRequest {
  uint64 user_id = 1;
  uint64 persona_id = 2;
  string device_id = 3;
}

message CreateWsTicketResponse {
  string ticket = 1;
  int64 expires_at = 2;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc SocialLogin(SocialLoginRequest) returns (SocialLoginResponse);
  // Deprecated phone-binding flow: retained for wire compatibility. The
  // transport rejects both RPCs with AUTH_UNAUTHORIZED.
  rpc SendSocialPhoneCode(SendSocialPhoneCodeRequest) returns (SendSocialPhoneCodeResponse) {
    option deprecated = true;
  }
  rpc BindSocialPhone(BindSocialPhoneRequest) returns (BindSocialPhoneResponse) {
    option deprecated = true;
  }
  rpc BindSocialIdentity(BindSocialIdentityRequest) returns (BindSocialIdentityResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
  rpc CreateWsTicket(CreateWsTicketRequest) returns (CreateWsTicketResponse);
}
