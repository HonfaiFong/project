syntax = "proto3";

package content.v1;

import "common/v1/pagination.proto";
import "common/v1/identity.proto";

option go_package = "social-backend/contracts/gen/go/content/v1;contentv1";
option php_namespace = "Contracts\\Gen\\Content\\V1";
option php_metadata_namespace = "Contracts\\Gen\\GPBMetadata\\Content\\V1";

message MediaItem {
  int32 type = 1;
  string object_key = 2;
  string mime_type = 3;
  int32 width = 4;
  int32 height = 5;
  int32 duration_ms = 6;
  int32 sort_order = 7;
}

message Post {
  uint64 id = 1;
  uint64 persona_id = 2;
  int32 type = 3;
  string content = 4;
  int32 visibility = 5;
  string emotion = 6;
  int32 status = 7;
  int32 moderation_status = 8;
  uint64 like_count = 9;
  uint64 comment_count = 10;
  uint64 view_count = 11;
  repeated MediaItem media = 12;
  string published_at = 13;
  string created_at = 14;
  common.v1.PublicAuthor author = 15;
}

// Public response shape. It deliberately has no internal user_id or
// persona_id ownership fields; author identity is represented by PublicAuthor.
message PublicPost {
  uint64 post_id = 1;
  int32 type = 2;
  string content = 3;
  int32 visibility = 4;
  string emotion = 5;
  int32 status = 6;
  int32 moderation_status = 7;
  uint64 like_count = 8;
  uint64 comment_count = 9;
  uint64 view_count = 10;
  repeated MediaItem media = 11;
  string published_at = 12;
  string created_at = 13;
  common.v1.PublicAuthor author = 14;
}

message CreatePostRequest {
  string request_id = 1;
  uint64 persona_id = 2;
  int32 type = 3;
  string content = 4;
  int32 visibility = 5;
  string emotion = 6;
  repeated MediaItem media = 7;
  common.v1.IdentityMode identity_mode = 8;
  string alias_display_name = 9;
}

message CreatePostResponse {
  PublicPost post = 1;
}

message GetPostRequest {
  uint64 post_id = 1;
}

message GetPostResponse {
  PublicPost post = 1;
}

message BatchGetPostsRequest {
  repeated uint64 post_ids = 1;
}

message BatchGetPostsResponse {
  repeated PublicPost posts = 1;
}

message DeletePostRequest {
  uint64 post_id = 1;
  uint64 persona_id = 2;
  // Trusted authenticated account id. Authorization checks ownership by
  // user id and does not require the snapshot author persona to be MAIN.
  uint64 user_id = 3;
}

message DeletePostResponse {
  bool success = 1;
}

message Comment {
  uint64 id = 1;
  uint64 post_id = 2;
  uint64 persona_id = 3;
  uint64 parent_id = 4;
  uint64 reply_to_comment_id = 5;
  string content = 6;
  int32 status = 7;
  uint64 like_count = 8;
  string created_at = 9;
  common.v1.PublicAuthor author = 10;
}

// Public response shape. The internal author ownership columns stay private.
message PublicComment {
  uint64 comment_id = 1;
  uint64 post_id = 2;
  uint64 parent_id = 3;
  uint64 reply_to_comment_id = 4;
  string content = 5;
  int32 status = 6;
  uint64 like_count = 7;
  string created_at = 8;
  common.v1.PublicAuthor author = 9;
}

message CreateCommentRequest {
  string request_id = 1;
  uint64 post_id = 2;
  uint64 persona_id = 3;
  uint64 parent_id = 4;
  uint64 reply_to_comment_id = 5;
  string content = 6;
  common.v1.IdentityMode identity_mode = 7;
  string alias_display_name = 8;
}

message CreateCommentResponse {
  PublicComment comment = 1;
}

message ListCommentsRequest {
  uint64 post_id = 1;
  uint64 parent_id = 2;
  common.v1.PaginationRequest pagination = 3;
}

message ListCommentsResponse {
  repeated PublicComment comments = 1;
  common.v1.PaginationResponse pagination = 2;
}

message DeleteCommentRequest {
  uint64 comment_id = 1;
  // Deprecated body fields are retained for rolling source compatibility.
  // The service uses authenticated metadata and the persisted owner.
  uint64 user_id = 2;
  uint64 persona_id = 3;
}

message DeleteCommentResponse {
  bool success = 1;
}

message UpdatePostStatusRequest {
  uint64 post_id = 1;
  int32 status = 2;
  int32 moderation_status = 3;
}

// Which listing a ListPosts call resolves. Boards split by the author
// identity mode recorded on the post; comments never change the board.
enum BoardScope {
  BOARD_SCOPE_UNSPECIFIED = 0;
  BOARD_SCOPE_MAIN = 1;
  BOARD_SCOPE_ALIAS = 2;
  BOARD_SCOPE_PERSONA_HOME = 3;
  BOARD_SCOPE_OWN = 4;
}

message ListPostsRequest {
  common.v1.PaginationRequest pagination = 1;
  BoardScope scope = 2;
  // Required when scope = BOARD_SCOPE_PERSONA_HOME and rejected otherwise.
  // The listing only ever returns public MAIN posts of this persona.
  uint64 persona_id = 3;
  // Optional identity filter for the own-posts management view;
  // UNSPECIFIED returns both MAIN and ALIAS posts.
  common.v1.IdentityMode identity_filter = 4;
}

message ListPostsResponse {
  repeated PublicPost posts = 1;
  common.v1.PaginationResponse pagination = 2;
}

message UpdatePostStatusResponse {
  bool success = 1;
}

// Internal-only lookup used by ChatService. The tuple is resolved against a
// persisted alias snapshot; the opaque reference format is never accepted as
// authentication by itself.
message ResolveAnonymousTargetRequest {
  string scope_type = 1;
  string scope_id = 2;
  string anonymous_ref = 3;
}

message ResolveAnonymousTargetResponse {
  uint64 user_id = 1;
  uint64 persona_id = 2;
  common.v1.IdentityMode identity_mode = 3;
  common.v1.PublicAuthor author = 4;
}

message CanAccessResourceRequest {
  string resource_type = 1;
  uint64 resource_id = 2;
  string action = 3;
}

message CanAccessResourceResponse {
  bool allowed = 1;
  string reason = 2;
  // Internal authorization projection for SocialService. These fields never
  // cross the public HTTP projection and let Social enforce blocks locally.
  uint64 resource_author_user_id = 3;
  uint64 root_author_user_id = 4;
}

service ContentService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc BatchGetPosts(BatchGetPostsRequest) returns (BatchGetPostsResponse);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc UpdatePostStatus(UpdatePostStatusRequest) returns (UpdatePostStatusResponse);
  rpc ResolveAnonymousTarget(ResolveAnonymousTargetRequest) returns (ResolveAnonymousTargetResponse);
  rpc CanAccessResource(CanAccessResourceRequest) returns (CanAccessResourceResponse);
}
